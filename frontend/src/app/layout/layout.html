<div class="shell">
  <header class="topbar">
    <strong>TecnoStock</strong>
    <button class="btn btn-ghost menu-btn" (click)="menuAbierto.set(!menuAbierto())">Menú</button>
  </header>

  <nav class="sidebar" [class.abierto]="menuAbierto()">
    <div class="marca">TecnoStock</div>
    @for (e of enlaces; track e.ruta) {
      <a [routerLink]="e.ruta" routerLinkActive="activo" (click)="menuAbierto.set(false)">{{ e.texto }}</a>
    }
    <div class="usuario">
      <span>{{ auth.usuario()?.nombre_completo }}</span>
      <button class="btn btn-ghost" (click)="auth.logout()">Cerrar sesión</button>
    </div>
  </nav>

  <main class="contenido">
    <router-outlet />
  </main>
</div>
